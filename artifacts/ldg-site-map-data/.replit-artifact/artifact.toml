kind = "web"
previewPath = "/"
title = "LDG Site Map Data"
description = "Python GIS acquisition service for the Perry, Florida industrial site, with a minimal file, manifest and request-log status page."
version = "1.0.0"
id = "artifacts/ldg-site-map-data"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25103

[services.development]
run = "pnpm --filter @workspace/ldg-site-map-data run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ldg-site-map-data", "run", "build" ]
serve = "static"
publicDir = "artifacts/ldg-site-map-data/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25103"
BASE_PATH = "/"
